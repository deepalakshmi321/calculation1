<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calcutator</title>
  <style>
    body{
     background-color:#cefbfb;
     padding-left: 50px;
     padding-top: 20px;
}
.calculator{
    width:300px;
    border-radius:10px;
    background-color:#27303d;
    padding:10px;
    box-shadow:4px 4px 10px #0a9296 ;
}
.display{
    height:60px;
    font-size:24px;
    text-align:right;
    padding:5px;
    background-color:#818c72;
    border:1px solid #ccc;
    border-radius:5px;
    margin-bottom:10px;
    overflow: auto;    
}
.buttons{
    display:grid;
    grid-template-columns: repeat(4,3fr);
    gap: 5px;
}
button{
    height:80px;
    width:70px;
    font-size:25px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background-color:#e2dbc0;
}
button:hover{
     background-color: #ca5858;
}

  </style>
  
</head>
<body>
  <div class="calculator">
    <input class="display" id="display"  value="0" />
    <div class="buttons">
      <button onclick="appendToDisplay('(')">(</button>
      <button onclick="appendToDisplay(')')">)</button>
      <button onclick="clearLastElement()">CE</button>
      <button onclick="clearDisplay()">C</button>
      <button onclick="appendToDisplay('7')">7</button>
      <button onclick="appendToDisplay('8')">8</button>
      <button onclick="appendToDisplay('9')">9</button>
      <button onclick="appendToDisplay('/')">/</button>
      <button onclick="appendToDisplay('4')">4</button>
      <button onclick="appendToDisplay('5')">5</button>
      <BUtton onclick="appendToDisplay('6')">6</BUtton>
      <BUtton onclick="appendToDisplay('*')">*</BUtton>
      <BUtton onclick="appendToDisplay('1')">1</BUtton>
      <BUtton onclick="appendToDisplay('2')">2</BUtton>
      <BUtton onclick="appendToDisplay('3')">3</BUtton>
      <BUtton onclick="appendToDisplay('-')">-</BUtton>
      <BUtton onclick="appendToDisplay('0')">0</BUtton>
      <BUtton onclick="appendToDisplay('.')">.</BUtton>
      <BUtton onclick="calculateResult()">=</BUtton>
      <BUtton onclick="appendToDisplay('+')">+</BUtton>
      
    </div>

  <script src="index.js" ></script>
</body>
</html>
